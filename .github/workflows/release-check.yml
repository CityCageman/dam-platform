name: Release Check

# 最小发版门禁：后端编译+单测、前端类型检查+构建、静态发布检查。
# 注意：这里使用公网 Maven 仓库，不要复用本地开发机的离线 Maven cache 路径。
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-check:
    name: Backend + frontend release gate
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            dam-platform/codebase/backend/pom.xml
            dam-platform/codebase/backend/*/pom.xml

      - name: Backend package (tests enabled)
        working-directory: dam-platform/codebase/backend
        run: |
          set -o pipefail
          mvn -B -DskipTests=false package 2>&1 | tee backend-build.log

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dam-platform/codebase/frontend/package-lock.json

      - name: Frontend install, type-check and build
        working-directory: dam-platform/codebase/frontend
        run: |
          set -o pipefail
          if [ -f package-lock.json ]; then
            npm ci 2>&1 | tee npm-install.log
          else
            npm install 2>&1 | tee npm-install.log
          fi
          npx vue-tsc --noEmit 2>&1 | tee vue-tsc.log
          npm run build 2>&1 | tee frontend-build.log

      - name: Static release checks
        run: bash dam-platform/deploy/release-check.sh

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-check-logs
          path: |
            dam-platform/codebase/backend/backend-build.log
            dam-platform/codebase/frontend/npm-install.log
            dam-platform/codebase/frontend/vue-tsc.log
            dam-platform/codebase/frontend/frontend-build.log
          if-no-files-found: warn
