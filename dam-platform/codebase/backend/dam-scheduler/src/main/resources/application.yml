server:
  port: 8096
spring:
  application:
    name: dam-scheduler
  profiles:
    active: dev
  config:
    import:
      - optional:nacos:${spring.application.name}.yml
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
  datasource:
    # 调度元数据独立存放在 dam_scheduler schema（见 db/v24_scheduler_management.sql）
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://10.162.3.16:11001/damplatform}
    username: ${SPRING_DATASOURCE_USERNAME:dam}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      schema: dam_scheduler
  jdbc:
    template:
      fetch-size: 100

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

sa-token:
  token-name: token
  timeout: 86400
  is-concurrent: true
  is-share: false
  token-style: jwt
  jwt-secret-key: ${SA_TOKEN_JWT_SECRET_KEY}
