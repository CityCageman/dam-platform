server:
  port: 8092
spring:
  application:
    name: asset-catalog
  profiles:
    active: dev
  config:
    import:
      - optional:nacos:${spring.application.name}.yml
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
sa-token:
  token-name: token
  timeout: 86400
  token-style: jwt
  jwt-secret-key: ${SA_TOKEN_JWT_SECRET_KEY}

dam:
  model-gateway-url: ${DAM_MODEL_GATEWAY_URL:${DAM_AGENT_URL:http://127.0.0.1:8089}}
  # 知识库由 ai-knowledge 独占，报表通过 HTTP 检索，不直连 dam_knowledge 表
  knowledge-url: ${DAM_KNOWLEDGE_URL:http://127.0.0.1:8098}
  jdbc:
    drivers-dir: ${DAM_JDBC_DRIVERS_DIR:jdbc-drivers}
