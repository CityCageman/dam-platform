server:
  port: 8087
spring:
  application:
    name: governance-lifecycle
  profiles:
    active: dev
  config:
    import:
      - optional:nacos:${spring.application.name}.yml
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
sa-token:
  token-name: token
  timeout: 86400
  token-style: jwt
  jwt-secret-key: ${SA_TOKEN_JWT_SECRET_KEY}

dam:
  asset-catalog-url: ${DAM_ASSET_CATALOG_URL:http://127.0.0.1:8092}
  operations-url: ${DAM_OPERATIONS_URL:http://127.0.0.1:8088}
