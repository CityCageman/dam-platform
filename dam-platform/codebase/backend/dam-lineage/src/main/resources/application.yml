server:
  port: 8093
spring:
  application:
    name: dam-lineage
  profiles:
    active: dev
  config:
    import:
      - optional:nacos:${spring.application.name}.yml
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
sa-token:
  token-name: token
  timeout: 86400
  is-concurrent: true
  is-share: false
  token-style: jwt
  jwt-secret-key: dam-platform-jwt-secret-key-2026
