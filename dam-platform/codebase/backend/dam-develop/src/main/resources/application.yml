server:
  port: 8100

spring:
  application:
    name: dam-develop
  profiles:
    active: dev
  config:
    import:
      # Nacos 配置中心为可选项：无 Nacos 时使用本地配置启动
      - optional:nacos:${spring.application.name}.yml
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        # Nacos 不可用时仅记录注册失败，不阻断服务启动
        fail-fast: ${NACOS_DISCOVERY_FAIL_FAST:false}
  datasource:
    # 数据开发任务元数据库；可通过 SPRING_DATASOURCE_* 覆盖
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://10.162.3.16:11001/damplatform?currentSchema=dam_dev}
    username: ${SPRING_DATASOURCE_USERNAME:dam}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver

mybatis-plus:
  configuration:
    # 数据库下划线列名映射到 Java 驼峰属性（如 task_code -> taskCode）
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      # 本服务所有表统一位于 dam_dev schema（实体 @TableName 亦显式声明）
      schema: dam_dev

sa-token:
  token-name: token
  timeout: 86400
  is-concurrent: true
  is-share: false
  token-style: jwt
  jwt-secret-key: ${SA_TOKEN_JWT_SECRET_KEY:dam-platform-dev-jwt-secret}
