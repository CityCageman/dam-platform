server:
  port: 8092
spring:
  application:
    name: dam-catalog
  profiles:
    active: dev
  config:
    import:
      - optional:nacos:${spring.application.name}.yml
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
sa-token:
  token-name: token
  timeout: 86400
  token-style: jwt
  jwt-secret-key: ${SA_TOKEN_JWT_SECRET_KEY}

dam:
  weknora:
    base-url: ${DAM_WEKNORA_BASE_URL:https://wiki-medical.cuhkszmc.cn/api/v1}
    api-key: ${DAM_WEKNORA_API_KEY:}
    llm-model: ${DAM_WEKNORA_LLM_MODEL:qwen3-coder-30b-a3b}
    embedding-model: ${DAM_WEKNORA_EMBEDDING_MODEL:bge-m3}
  jdbc:
    drivers-dir: ${DAM_JDBC_DRIVERS_DIR:jdbc-drivers}
