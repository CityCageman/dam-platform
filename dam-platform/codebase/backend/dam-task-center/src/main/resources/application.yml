server:
  port: 8099

spring:
  application:
    name: dam-task-center
  profiles:
    active: dev
  config:
    import:
      # Nacos 配置中心为可选项：无 Nacos 时使用本地配置启动
      - optional:nacos:${spring.application.name}.yml
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        # Nacos 不可用时仅记录注册失败，不阻断服务启动
        fail-fast: ${NACOS_DISCOVERY_FAIL_FAST:false}
  datasource:
    # 任务中心库；连接信息可通过 SPRING_DATASOURCE_* 覆盖
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://10.162.3.16:11001/damplatform?currentSchema=dam_task}
    username: ${SPRING_DATASOURCE_USERNAME:dam}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      # 连接建立后默认 search_path 指向 dam_task
      schema: dam_task
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jdbc:
    template:
      fetch-size: 100

mybatis-plus:
  configuration:
    # 数据库下划线列名映射到 Java 驼峰属性（如 task_code -> taskCode）
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      # 本服务所有表统一位于 dam_task schema（实体 @TableName 亦显式声明）
      schema: dam_task

sa-token:
  token-name: token
  timeout: 86400
  is-concurrent: true
  is-share: false
  token-style: jwt
  jwt-secret-key: ${SA_TOKEN_JWT_SECRET_KEY}

dam:
  task-center:
    # PENDING 实例超时阈值（分钟）：超时后标记 CANCELLED
    pending-timeout-minutes: 60
    # RUNNING 实例超时阈值（分钟）：按 started_at（为空回退 created_at）计时，超时后标记 FAILED
    running-timeout-minutes: 180
    # 超时回收扫描间隔（毫秒）；启动后首次扫描固定延迟 60 秒
    recover-interval-ms: 60000
