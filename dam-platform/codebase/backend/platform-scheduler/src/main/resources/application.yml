server:
  port: 8096
spring:
  application:
    name: platform-scheduler
  profiles:
    active: dev
  config:
    import:
      - optional:nacos:${spring.application.name}.yml
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
  datasource:
    # 调度元数据独立存放在 dam_dpm schema（见 db/v24_scheduler_management.sql）
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://10.162.3.16:11001/damplatform}
    username: ${SPRING_DATASOURCE_USERNAME:dam}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      schema: dam_dpm
  jdbc:
    template:
      fetch-size: 100

dam:
  # 统一任务中心地址，用于登记调度运行实例（失败只告警，不影响调度）
  task-center-url: ${DAM_TASK_CENTER_URL:http://127.0.0.1:8099}
  scheduler:
    # Cron 自动派发开关；关闭后不再定时扫描，仍可通过 POST /api/scheduler/dispatch/run 手动扫描
    dispatch-enabled: ${DAM_SCHEDULER_DISPATCH_ENABLED:true}
    # 自动派发扫描间隔（毫秒），对应 @Scheduled fixedDelay
    dispatch-interval-ms: ${DAM_SCHEDULER_DISPATCH_INTERVAL_MS:15000}
    # 超过该分钟数仍为 RUNNING 的运行记录会被定时回收为 FAILED（服务重启遗留）
    stale-run-minutes: ${DAM_SCHEDULER_STALE_RUN_MINUTES:180}
    # 遗留 RUNNING 回收扫描间隔（毫秒）
    stale-run-scan-interval-ms: ${DAM_SCHEDULER_STALE_SCAN_INTERVAL_MS:60000}
    # 执行引擎：LOCAL=本地顺序 SQL DAG（默认，保持存量行为）；DOLPHIN=触发 DolphinScheduler
    # 任务级 execution_engine 优先；全局值仅作为新建任务的默认引擎
    engine: ${DAM_SCHEDULER_ENGINE:LOCAL}   # LOCAL/DOLPHIN
    dolphin:
      # DS 总开关；false 时 DOLPHIN 引擎任务直接失败并给出明确原因，服务仍可正常启动
      enabled: ${DAM_DOLPHIN_ENABLED:false}
      # DS API 基础地址，必须包含 /dolphinscheduler 上下文，仅允许 http/https
      base-url: ${DAM_DOLPHIN_URL:http://127.0.0.1:12345/dolphinscheduler}
      # DS 访问 token，仅通过请求头 token 传递，不写日志
      token: ${DAM_DOLPHIN_TOKEN:}
      project-code: ${DAM_DOLPHIN_PROJECT_CODE:}
      tenant-code: ${DAM_DOLPHIN_TENANT:}
      connect-timeout-ms: 3000
      read-timeout-ms: 10000
      # DS 流程实例状态轮询间隔（毫秒）与单轮最大条数
      poll-interval-ms: ${DAM_DOLPHIN_POLL_INTERVAL_MS:15000}
      poll-batch-size: ${DAM_DOLPHIN_POLL_BATCH_SIZE:50}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

sa-token:
  token-name: token
  timeout: 86400
  is-concurrent: true
  is-share: false
  token-style: jwt
  jwt-secret-key: ${SA_TOKEN_JWT_SECRET_KEY}
