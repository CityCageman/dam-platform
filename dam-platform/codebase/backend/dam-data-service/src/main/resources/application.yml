server:
  port: 8097

spring:
  application:
    name: dam-data-service
  profiles:
    active: dev
  config:
    import:
      # Nacos 配置中心为可选项：无 Nacos 时使用本地配置启动
      - optional:nacos:${spring.application.name}.yml
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
  autoconfigure:
    # 数据服务阶段 1 不连接数据库，排除数据源/MyBatis-Plus 自动装配
    # （dam-common 依赖传递了 mybatis-plus 与 spring-boot-starter-jdbc 相关配置）
    exclude:
      # Spring Boot 4 中 DataSource 自动装配迁移至 spring-boot-jdbc 模块，包路径为 org.springframework.boot.jdbc.autoconfigure
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - com.baomidou.mybatisplus.autoconfigure.MybatisPlusAutoConfiguration

# 数据服务 API 管理为阶段 1 骨架：目录、订阅、发布均未接入数据库
dam:
  data-service:
    # 后续阶段在此配置数据服务专属库/网关注册地址
    api-publish-enabled: false
