# 网关开发环境配置：本地无 Nacos 时直连各服务（生产环境使用 lb:// 服务发现，见 application.yml）
spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: platform-auth
              uri: http://localhost:8081
              predicates:
                - Path=/api/auth/**
            - id: asset-catalog
              uri: http://localhost:8092
              predicates:
                - Path=/api/catalog/**
            - id: governance-lineage
              uri: http://localhost:8093
              predicates:
                - Path=/api/lineage/**
            - id: governance-standard
              uri: http://localhost:8084
              predicates:
                - Path=/api/standard/**
            - id: governance-quality
              uri: http://localhost:8085
              predicates:
                - Path=/api/quality/**
            - id: governance-security
              uri: http://localhost:8086
              predicates:
                - Path=/api/security/**
            - id: governance-lifecycle
              uri: http://localhost:8087
              predicates:
                - Path=/api/lifecycle/**
            - id: platform-operations
              uri: http://localhost:8088
              predicates:
                - Path=/api/operations/**
            - id: ai-model-gateway
              uri: http://localhost:8089
              predicates:
                - Path=/api/model-gateway/**
                - Path=/api/agent/**
            - id: ai-workbench
              uri: ${DAM_ROUTE_AI_WORKBENCH:http://localhost:8090}
              predicates:
                - Path=/api/ai-workbench/**
            - id: ai-knowledge
              uri: ${DAM_ROUTE_KNOWLEDGE:http://localhost:8098}
              predicates:
                - Path=/api/knowledge/**
            - id: analytics-metric
              uri: ${DAM_ROUTE_METRIC:http://localhost:8094}
              predicates:
                - Path=/api/metrics/**
            - id: access-integration
              uri: ${DAM_ROUTE_INTEGRATION:http://localhost:8095}
              predicates:
                - Path=/api/integration/**
            - id: platform-scheduler
              uri: ${DAM_ROUTE_SCHEDULER:http://localhost:8096}
              predicates:
                - Path=/api/scheduler/**
            - id: service-api
              uri: ${DAM_ROUTE_DATA_SERVICE:http://localhost:8097}
              predicates:
                - Path=/api/data-service/**
            - id: service-open-api
              uri: ${DAM_ROUTE_DATA_SERVICE:http://localhost:8097}
              predicates:
                - Path=/open-api/**
            - id: platform-task-center
              uri: ${DAM_ROUTE_TASK_CENTER:http://localhost:8099}
              predicates:
                - Path=/api/task-center/**
            - id: processing-develop
              uri: ${DAM_ROUTE_DEVELOP:http://localhost:8100}
              predicates:
                - Path=/api/dev/**
            - id: platform-portal
              uri: ${DAM_ROUTE_PORTAL:http://localhost:8091}
              predicates:
                - Path=/api/portal/**
