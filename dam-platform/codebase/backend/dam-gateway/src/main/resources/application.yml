spring:
  application:
    name: dam-gateway
  profiles:
    active: dev
  config:
    import:
      - optional:nacos:${spring.application.name}.yml
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
    gateway:
      server:
        webflux:
          routes:
            - id: dam-auth
              uri: ${DAM_ROUTE_AUTH:lb://dam-auth}
              predicates:
                - Path=/api/auth/**
            - id: dam-catalog
              uri: ${DAM_ROUTE_CATALOG:lb://dam-catalog}
              predicates:
                - Path=/api/catalog/**
            - id: governance-lineage
              uri: ${DAM_ROUTE_LINEAGE:lb://governance-lineage}
              predicates:
                - Path=/api/lineage/**
            - id: governance-standard
              uri: ${DAM_ROUTE_STANDARD:lb://governance-standard}
              predicates:
                - Path=/api/standard/**
            - id: governance-quality
              uri: ${DAM_ROUTE_QUALITY:lb://governance-quality}
              predicates:
                - Path=/api/quality/**
            - id: governance-security
              uri: ${DAM_ROUTE_SECURITY:lb://governance-security}
              predicates:
                - Path=/api/security/**
            - id: governance-lifecycle
              uri: ${DAM_ROUTE_LIFECYCLE:lb://governance-lifecycle}
              predicates:
                - Path=/api/lifecycle/**
            - id: platform-operations
              uri: ${DAM_ROUTE_OPERATIONS:lb://platform-operations}
              predicates:
                - Path=/api/operations/**
            - id: ai-model-gateway
              uri: ${DAM_ROUTE_MODEL_GATEWAY:${DAM_ROUTE_AGENT:http://localhost:8089}}
              predicates:
                # 两个前缀必须放在同一个 Path 谓词里；分开写会被 Gateway 按 AND 处理
                - Path=/api/model-gateway/**,/api/agent/**
            - id: ai-workbench
              uri: ${DAM_ROUTE_AI_WORKBENCH:http://localhost:8090}
              predicates:
                - Path=/api/ai-workbench/**
            - id: ai-knowledge
              uri: ${DAM_ROUTE_KNOWLEDGE:http://localhost:8098}
              predicates:
                - Path=/api/knowledge/**
            - id: analytics-metric
              uri: ${DAM_ROUTE_METRIC:http://localhost:8094}
              predicates:
                - Path=/api/metrics/**
            - id: dam-access
              uri: ${DAM_ROUTE_ACCESS:http://localhost:8095}
              predicates:
                - Path=/api/access/**
            - id: access-integration
              uri: ${DAM_ROUTE_INTEGRATION:http://localhost:8095}
              predicates:
                - Path=/api/integration/**
            - id: platform-scheduler
              uri: ${DAM_ROUTE_SCHEDULER:http://localhost:8096}
              predicates:
                - Path=/api/scheduler/**
            - id: service-api
              uri: ${DAM_ROUTE_DATA_SERVICE:http://localhost:8097}
              predicates:
                - Path=/api/data-service/**
            - id: dam-open-api
              uri: ${DAM_ROUTE_DATA_SERVICE:http://localhost:8097}
              predicates:
                - Path=/open-api/**
            - id: platform-task-center
              uri: ${DAM_ROUTE_TASK_CENTER:http://localhost:8099}
              predicates:
                - Path=/api/task-center/**
            - id: processing-develop
              uri: ${DAM_ROUTE_DEVELOP:http://localhost:8100}
              predicates:
                - Path=/api/dev/**
            - id: platform-portal
              uri: ${DAM_ROUTE_PORTAL:http://localhost:8091}
              predicates:
                - Path=/api/portal/**
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOriginPatterns:
                  - ${DAM_CORS_ORIGINS:http://localhost:5173}
                allowedMethods: "GET,POST,PUT,DELETE,OPTIONS"
                allowedHeaders: "token,Content-Type,Authorization,X-API-Key"
                allowCredentials: true

server:
  port: 8080

sa-token:
  token-name: token
  timeout: 86400
  is-concurrent: true
  is-share: false
  token-style: jwt
  jwt-secret-key: ${SA_TOKEN_JWT_SECRET_KEY}
