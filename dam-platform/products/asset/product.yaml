code: DAM
name: 数据资产与主数据
version: 1.0.0
description: 资产目录、资产 360、元数据与主数据管理
services:
  - asset-catalog
  - asset-mdm
schemas:
  - dam_dam
routes:
  - /api/catalog/**
  - /api/asset/**
  - /api/metadata/**
  - /api/mdm/**
frontend:
  remote: asset-ui
  entry: /products/asset/remoteEntry.js
permissions: [asset:view, asset:manage, metadata:view, mdm:view, mdm:manage]
requiresProducts: []
requiresPlatform: ">=1.0.0 <2.0.0"
optionalProducts: [DGP, DAN]
