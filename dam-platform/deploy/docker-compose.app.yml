# 数据资产管理平台 - 应用集群服务器 Docker Compose（台2：网关 + 16 个业务微服务）
# 说明：本文件只部署后端微服务，数据库与 Nacos 均在其他服务器，通过环境变量连接。
# 前置：先执行 deploy/build.sh 产出各服务 *-exec.jar（JDK 21），并确保台1数据库、台3 Nacos 已就绪。
# 用法：cd deploy && docker compose -f docker-compose.app.yml up -d --build
# 数据库：新库/已有库的 schema 升级见 db/release/README.md（v21~v25）。
name: dam-platform-app

# 连库服务的数据库连接（指向已存在的 PostgreSQL，10.162.3.16:11001）
# 数据源走环境变量，不走 Nacos 配置中心
x-pg-env: &pg-env
  SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST:-10.162.3.16}:${DB_PORT:-11001}/damplatform
  SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-dam}
  SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
  TZ: Asia/Shanghai

# Nacos 注册/配置中心地址（指向台3）
x-nacos-env: &nacos-env
  NACOS_SERVER_ADDR: ${NACOS_HOST:-192.168.1.13}:8848

services:
  # ==================== 既有后端微服务 ====================
  dam-auth:
    build:
      context: ../codebase/backend
      dockerfile: Dockerfile
      args:
        JAR_FILE: dam-auth/target/dam-auth-1.0.0-exec.jar
    container_name: dam-auth
    restart: unless-stopped
    environment:
      <<: *pg-env
      NACOS_SERVER_ADDR: ${NACOS_HOST:-192.168.1.13}:8848
      SA_TOKEN_JWT_SECRET_KEY: ${SA_TOKEN_JWT_SECRET_KEY:?SA_TOKEN_JWT_SECRET_KEY is required}

  dam-catalog:
    build:
      context: ../codebase/backend
      dockerfile: Dockerfile
      args:
        JAR_FILE: dam-catalog/target/dam-catalog-1.0.0-exec.jar
    container_name: dam-catalog
    restart: unless-stopped
    environment:
      <<: *pg-env
      NACOS_SERVER_ADDR: ${NACOS_HOST:-192.168.1.13}:8848
      SA_TOKEN_JWT_SECRET_KEY: ${SA_TOKEN_JWT_SECRET_KEY:?SA_TOKEN_JWT_SECRET_KEY is required}
      # 外键血缘自动落库调用 lineage 服务（同机容器网络内用服务名）
      DAM_LINEAGE_URL: http://governance-lineage:8093
      # 报表 SQL 生成调用编码智能体（同机容器网络内用服务名）
      DAM_MODEL_GATEWAY_URL: http://ai-model-gateway:8089
      # 指标/知识/质量只读接口均走容器服务名，避免默认 127.0.0.1
      DAM_METRIC_URL: http://dam-metric:8094
      DAM_KNOWLEDGE_URL: http://ai-knowledge:8098
      DAM_QUALITY_URL: http://governance-quality:8085

  governance-lineage:
    build:
      context: ../codebase/backend
      dockerfile: Dockerfile
      args:
        JAR_FILE: governance-lineage/target/governance-lineage-1.0.0-exec.jar
    container_name: governance-lineage
    restart: unless-stopped
    environment:
      <<: *pg-env
      NACOS_SERVER_ADDR: ${NACOS_HOST:-192.168.1.13}:8848
      SA_TOKEN_JWT_SECRET_KEY: ${SA_TOKEN_JWT_SECRET_KEY:?SA_TOKEN_JWT_SECRET_KEY is required}

  governance-standard:
    build:
      context: ../codebase/backend
      dockerfile: Dockerfile
      args:
        JAR_FILE: governance-standard/target/governance-standard-1.0.0-exec.jar
    container_name: governance-standard
    restart: unless-stopped
    environment:
      <<: *pg-env
      NACOS_SERVER_ADDR: ${NACOS_HOST:-192.168.1.13}:8848
      SA_TOKEN_JWT_SECRET_KEY: ${SA_TOKEN_JWT_SECRET_KEY:?SA_TOKEN_JWT_SECRET_KEY is required}

  governance-quality:
    build:
      context: ../codebase/backend
      dockerfile: Dockerfile
      args:
        JAR_FILE: governance-quality/target/governance-quality-1.0.0-exec.jar
    container_name: governance-quality
    restart: unless-stopped
    environment:
      <<: *pg-env
      NACOS_SERVER_ADDR: ${NACOS_HOST:-192.168.1.13}:8848
      SA_TOKEN_JWT_SECRET_KEY: ${SA_TOKEN_JWT_SECRET_KEY:?SA_TOKEN_JWT_SECRET_KEY is required}

  governance-security:
    build:
      context: ../codebase/backend
      dockerfile: Dockerfile
      args:
        JAR_FILE: governance-security/target/governance-security-1.0.0-exec.jar
    container_name: governance-security
    restart: unless-stopped
    environment:
      <<: *pg-env
      NACOS_SERVER_ADDR: ${NACOS_HOST:-192.168.1.13}:8848
      SA_TOKEN_JWT_SECRET_KEY: ${SA_TOKEN_JWT_SECRET_KEY:?SA_TOKEN_JWT_SECRET_KEY is required}

  governance-lifecycle:
    build:
      context: ../codebase/backend
      dockerfile: Dockerfile
      args:
        JAR_FILE: governance-lifecycle/target/governance-lifecycle-1.0.0-exec.jar
    container_name: governance-lifecycle
    restart: unless-stopped
    environment:
      <<: *pg-env
      NACOS_SERVER_ADDR: ${NACOS_HOST:-192.168.1.13}:8848
      SA_TOKEN_JWT_SECRET_KEY: ${SA_TOKEN_JWT_SECRET_KEY:?SA_TOKEN_JWT_SECRET_KEY is required}

  dam-operations:
    build:
      context: ../codebase/backend
      dockerfile: Dockerfile
      args:
        JAR_FILE: dam-operations/target/dam-operations-1.0.0-exec.jar
    container_name: dam-operations
    restart: unless-stopped
    environment:
      <<: *pg-env
      NACOS_SERVER_ADDR: ${NACOS_HOST:-192.168.1.13}:8848
      SA_TOKEN_JWT_SECRET_KEY: ${SA_TOKEN_JWT_SECRET_KEY:?SA_TOKEN_JWT_SECRET_KEY is required}

  # 智能体服务：不连库，仅外呼 LLM，密钥由 .env 注入
  ai-model-gateway:
    build:
      context: ../codebase/backend
      dockerfile: Dockerfile
      args:
        JAR_FILE: ai-model-gateway/target/ai-model-gateway-1.0.0-exec.jar
    container_name: ai-model-gateway
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      NACOS_SERVER_ADDR: ${NACOS_HOST:-192.168.1.13}:8848
      SA_TOKEN_JWT_SECRET_KEY: ${SA_TOKEN_JWT_SECRET_KEY:?SA_TOKEN_JWT_SECRET_KEY is required}
      DAM_MODEL_GATEWAY_CODE_BASE_URL: ${DAM_MODEL_GATEWAY_CODE_BASE_URL}
      DAM_MODEL_GATEWAY_CODE_API_KEY: ${DAM_MODEL_GATEWAY_CODE_API_KEY}
      DAM_MODEL_GATEWAY_CODE_MODEL: ${DAM_MODEL_GATEWAY_CODE_MODEL:-qwen3-coder-30b-a3b}

  # ==================== 新增服务（按数据中台边界拆分） ====================
  # AI 工作台：AI 编排，模型调用走 model-gateway，元数据工具走 catalog，不直连数据库
  ai-workbench:
    build:
      context: ../codebase/backend
      dockerfile: Dockerfile
      args:
        JAR_FILE: ai-workbench/target/ai-workbench-1.0.0-exec.jar
    container_name: ai-workbench
    restart: unless-stopped
    environment:
      <<: *pg-env
      TZ: Asia/Shanghai
      NACOS_SERVER_ADDR: ${NACOS_HOST:-192.168.1.13}:8848
      SA_TOKEN_JWT_SECRET_KEY: ${SA_TOKEN_JWT_SECRET_KEY:?SA_TOKEN_JWT_SECRET_KEY is required}
      DAM_MODEL_GATEWAY_URL: http://ai-model-gateway:8089
      DAM_CATALOG_URL: http://dam-catalog:8092

  # 统一门户 BFF：静态目录配置，不连库
  dam-portal:
    build:
      context: ../codebase/backend
      dockerfile: Dockerfile
      args:
        JAR_FILE: dam-portal/target/dam-portal-1.0.0-exec.jar
    container_name: dam-portal
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      NACOS_SERVER_ADDR: ${NACOS_HOST:-192.168.1.13}:8848

  # 指标中心：dam_metric schema（v21）
  dam-metric:
    build:
      context: ../codebase/backend
      dockerfile: Dockerfile
      args:
        JAR_FILE: dam-metric/target/dam-metric-1.0.0-exec.jar
    container_name: dam-metric
    restart: unless-stopped
    environment:
      <<: *pg-env
      NACOS_SERVER_ADDR: ${NACOS_HOST:-192.168.1.13}:8848
      SA_TOKEN_JWT_SECRET_KEY: ${SA_TOKEN_JWT_SECRET_KEY:?SA_TOKEN_JWT_SECRET_KEY is required}
      DAM_CATALOG_URL: http://dam-catalog:8092

  # 知识库：dam_knowledge schema（v21），指标口径通过 HTTP 读取 metric
  ai-knowledge:
    build:
      context: ../codebase/backend
      dockerfile: Dockerfile
      args:
        JAR_FILE: ai-knowledge/target/ai-knowledge-1.0.0-exec.jar
    container_name: ai-knowledge
    restart: unless-stopped
    environment:
      <<: *pg-env
      DAM_WEKNORA_BASE_URL: ${DAM_WEKNORA_BASE_URL:-https://wiki-medical.cuhkszmc.cn/api/v1}
      DAM_WEKNORA_API_KEY: ${DAM_WEKNORA_API_KEY:-}
      DAM_WEKNORA_LLM_MODEL: ${DAM_WEKNORA_LLM_MODEL:-qwen3-coder-30b-a3b}
      DAM_WEKNORA_EMBEDDING_MODEL: ${DAM_WEKNORA_EMBEDDING_MODEL:-bge-m3}
      NACOS_SERVER_ADDR: ${NACOS_HOST:-192.168.1.13}:8848
      SA_TOKEN_JWT_SECRET_KEY: ${SA_TOKEN_JWT_SECRET_KEY:?SA_TOKEN_JWT_SECRET_KEY is required}
      DAM_METRIC_URL: http://dam-metric:8094

  # 数据集成：dam_integration schema（v23）
  access-integration:
    build:
      context: ../codebase/backend
      dockerfile: Dockerfile
      args:
        JAR_FILE: access-integration/target/access-integration-1.0.0-exec.jar
    container_name: access-integration
    restart: unless-stopped
    environment:
      <<: *pg-env
      DAM_TASK_CENTER_URL: http://dam-task-center:8099
      NACOS_SERVER_ADDR: ${NACOS_HOST:-192.168.1.13}:8848
      DAM_CREDENTIAL_SECRET: ${DAM_CREDENTIAL_SECRET:?DAM_CREDENTIAL_SECRET is required}
      SA_TOKEN_JWT_SECRET_KEY: ${SA_TOKEN_JWT_SECRET_KEY:?SA_TOKEN_JWT_SECRET_KEY is required}

  # 调度中心：dam_scheduler schema（v24）
  dam-scheduler:
    build:
      context: ../codebase/backend
      dockerfile: Dockerfile
      args:
        JAR_FILE: dam-scheduler/target/dam-scheduler-1.0.0-exec.jar
    container_name: dam-scheduler
    restart: unless-stopped
    environment:
      DAM_SCHEDULER_ENGINE: ${DAM_SCHEDULER_ENGINE:-LOCAL}
      DAM_DOLPHIN_ENABLED: ${DAM_DOLPHIN_ENABLED:-false}
      DAM_DOLPHIN_URL: ${DAM_DOLPHIN_URL:-http://host.docker.internal:12345/dolphinscheduler}
      DAM_DOLPHIN_TOKEN: ${DAM_DOLPHIN_TOKEN:-}
      DAM_DOLPHIN_PROJECT_CODE: ${DAM_DOLPHIN_PROJECT_CODE:-}
      DAM_DOLPHIN_TENANT: ${DAM_DOLPHIN_TENANT:-}
      <<: *pg-env
      DAM_TASK_CENTER_URL: http://dam-task-center:8099
      NACOS_SERVER_ADDR: ${NACOS_HOST:-192.168.1.13}:8848
      DAM_CREDENTIAL_SECRET: ${DAM_CREDENTIAL_SECRET:?DAM_CREDENTIAL_SECRET is required}
      SA_TOKEN_JWT_SECRET_KEY: ${SA_TOKEN_JWT_SECRET_KEY:?SA_TOKEN_JWT_SECRET_KEY is required}

  # 数据服务：dam_data_service schema（v25）
  dam-data-service:
    build:
      context: ../codebase/backend
      dockerfile: Dockerfile
      args:
        JAR_FILE: dam-data-service/target/dam-data-service-1.0.0-exec.jar
    container_name: dam-data-service
    restart: unless-stopped
    environment:
      <<: *pg-env
      NACOS_SERVER_ADDR: ${NACOS_HOST:-192.168.1.13}:8848
      DAM_CREDENTIAL_SECRET: ${DAM_CREDENTIAL_SECRET:?DAM_CREDENTIAL_SECRET is required}
      SA_TOKEN_JWT_SECRET_KEY: ${SA_TOKEN_JWT_SECRET_KEY:?SA_TOKEN_JWT_SECRET_KEY is required}

  # 统一任务中心：dam_task schema（v26）
  dam-task-center:
    build:
      context: ../codebase/backend
      dockerfile: Dockerfile
      args:
        JAR_FILE: dam-task-center/target/dam-task-center-1.0.0-exec.jar
    container_name: dam-task-center
    restart: unless-stopped
    environment:
      <<: *pg-env
      NACOS_SERVER_ADDR: ${NACOS_HOST:-192.168.1.13}:8848
      SA_TOKEN_JWT_SECRET_KEY: ${SA_TOKEN_JWT_SECRET_KEY:?SA_TOKEN_JWT_SECRET_KEY is required}

  # 数据开发：dam_dev schema（v27）
  processing-develop:
    build:
      context: ../codebase/backend
      dockerfile: Dockerfile
      args:
        JAR_FILE: processing-develop/target/processing-develop-1.0.0-exec.jar
    container_name: processing-develop
    restart: unless-stopped
    environment:
      <<: *pg-env
      NACOS_SERVER_ADDR: ${NACOS_HOST:-192.168.1.13}:8848
      DAM_CREDENTIAL_SECRET: ${DAM_CREDENTIAL_SECRET:?DAM_CREDENTIAL_SECRET is required}
      SA_TOKEN_JWT_SECRET_KEY: ${SA_TOKEN_JWT_SECRET_KEY:?SA_TOKEN_JWT_SECRET_KEY is required}


  # ==================== 网关 ====================
  # 网关：对外唯一 API 入口；容器内路由必须显式指向服务名，默认 localhost 会指向网关自身。
  dam-gateway:
    build:
      context: ../codebase/backend
      dockerfile: Dockerfile
      args:
        JAR_FILE: dam-gateway/target/dam-gateway-1.0.0-exec.jar
    container_name: dam-gateway
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Shanghai
      NACOS_SERVER_ADDR: ${NACOS_HOST:-192.168.1.13}:8848
      # 网关门禁：JWT 验签密钥，必须与各业务服务一致
      SA_TOKEN_JWT_SECRET_KEY: ${SA_TOKEN_JWT_SECRET_KEY:?SA_TOKEN_JWT_SECRET_KEY is required}
      DAM_CORS_ORIGINS: ${DAM_CORS_ORIGINS:-http://localhost:5173}
      # 路由地址：全部改为容器服务名
      DAM_ROUTE_AUTH: http://dam-auth:8081
      DAM_ROUTE_CATALOG: http://dam-catalog:8092
      DAM_ROUTE_LINEAGE: http://governance-lineage:8093
      DAM_ROUTE_STANDARD: http://governance-standard:8084
      DAM_ROUTE_QUALITY: http://governance-quality:8085
      DAM_ROUTE_SECURITY: http://governance-security:8086
      DAM_ROUTE_LIFECYCLE: http://governance-lifecycle:8087
      DAM_ROUTE_OPERATIONS: http://dam-operations:8088
      DAM_ROUTE_MODEL_GATEWAY: http://ai-model-gateway:8089
      DAM_ROUTE_AI_WORKBENCH: http://ai-workbench:8090
      DAM_ROUTE_PORTAL: http://dam-portal:8091
      DAM_ROUTE_METRIC: http://dam-metric:8094
      DAM_ROUTE_KNOWLEDGE: http://ai-knowledge:8098
      DAM_ROUTE_INTEGRATION: http://access-integration:8095
      DAM_ROUTE_SCHEDULER: http://dam-scheduler:8096
      DAM_ROUTE_DATA_SERVICE: http://dam-data-service:8097
      DAM_ROUTE_OPEN_API: http://dam-data-service:8097
      DAM_ROUTE_TASK_CENTER: http://dam-task-center:8099
      DAM_ROUTE_DEVELOP: http://processing-develop:8100
    # 对外暴露 8080，供中间件服务器（台3）Nginx 反代 /api 访问
    ports:
      - "8080:8080"
    depends_on:
      - dam-auth
      - dam-catalog
      - governance-lineage
      - governance-standard
      - governance-quality
      - governance-security
      - governance-lifecycle
      - dam-operations
      - ai-model-gateway
      - ai-workbench
      - dam-portal
      - dam-metric
      - ai-knowledge
      - access-integration
      - dam-scheduler
      - dam-data-service
      - dam-task-center
      - processing-develop

# 微服务无本地状态，数据全在 PG，无需持久化卷
