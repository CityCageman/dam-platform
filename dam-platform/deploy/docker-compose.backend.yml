# 数据资产管理平台 - 后端微服务 Docker Compose（本地一体化：Nacos + PostgreSQL + 16 个业务服务 + 网关）
# 说明：网关对外暴露 8080，供前端服务器反代 /api；其余服务只在容器网络内互相访问。
# 前置：先执行 deploy/build.sh 完成后端 jar 编译（JDK 21）。
# 用法：cd deploy && docker compose -f docker-compose.backend.yml up -d --build
# 数据库：01/02/03~26 初始化脚本（含 v2~v25 增量）只在 pgdata 卷为空时执行一次；已有库升级见 db/release/README.md。
name: dam-platform-backend

# 连库服务的通用数据库连接（PostgreSQL 容器内部地址）
x-pg-env: &pg-env
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/damplatform
  SPRING_DATASOURCE_USERNAME: dam
  SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
  TZ: Asia/Shanghai

# 各服务 Nacos 注册/配置中心地址（容器内部地址）
x-nacos-env: &nacos-env
  NACOS_SERVER_ADDR: nacos:8848

services:
  # ==================== 注册中心 / 配置中心 ====================
  nacos:
    image: nacos/nacos-server:v3.1.1
    container_name: dam-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      TZ: Asia/Shanghai
    ports:
      - "8848:8848"   # 控制台 / HTTP API
      - "9848:9848"   # gRPC 客户端端口（Nacos 2.x+ 必需，主端口+1000）
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8848/nacos/v1/console/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # ==================== 数据库 ====================
  postgres:
    image: postgres:15-alpine
    container_name: dam-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: damplatform
      POSTGRES_USER: dam
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      TZ: Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 首次初始化：基础结构 → 种子数据 → 历史增量 v2~v20 → 本次新 schema v21~v25（按文件名前缀顺序执行）
      # 说明：01/02 不含 v10/v11 等历史表，故 v2~v20 一并挂载；v21/v22 依赖这些基础表已存在。
      # 已有库/非空 pgdata 卷不会重跑 initdb，请用 db/release/apply_new_schemas.sh 手工升级（见 db/release/README.md）。
      - ../db/create_schema_doc.sql:/docker-entrypoint-initdb.d/01_create_schema.sql:ro
      - ../db/初始化.sql:/docker-entrypoint-initdb.d/02_init_data.sql:ro
      - ../db/v2_subject_domain.sql:/docker-entrypoint-initdb.d/03_v2_subject_domain.sql:ro
      - ../db/v3_report_system.sql:/docker-entrypoint-initdb.d/04_v3_report_system.sql:ro
      - ../db/v4_lineage_layers.sql:/docker-entrypoint-initdb.d/05_v4_lineage_layers.sql:ro
      - ../db/v5_ai_tasks.sql:/docker-entrypoint-initdb.d/06_v5_ai_tasks.sql:ro
      - ../db/v6_lineage_identity.sql:/docker-entrypoint-initdb.d/07_v6_lineage_identity.sql:ro
      - ../db/v7_lifecycle_execution.sql:/docker-entrypoint-initdb.d/08_v7_lifecycle_execution.sql:ro
      - ../db/v8_schema_backfill.sql:/docker-entrypoint-initdb.d/09_v8_schema_backfill.sql:ro
      - ../db/v9_rename_ai_menu.sql:/docker-entrypoint-initdb.d/10_v9_rename_ai_menu.sql:ro
      - ../db/v10_metric_definition.sql:/docker-entrypoint-initdb.d/11_v10_metric_definition.sql:ro
      - ../db/v11_knowledge_base.sql:/docker-entrypoint-initdb.d/12_v11_knowledge_base.sql:ro
      - ../db/v12_weknora_sync.sql:/docker-entrypoint-initdb.d/13_v12_weknora_sync.sql:ro
      - ../db/v13_weknora_field_sync.sql:/docker-entrypoint-initdb.d/14_v13_weknora_field_sync.sql:ro
      - ../db/v14_knowledge_category_tree.sql:/docker-entrypoint-initdb.d/15_v14_knowledge_category_tree.sql:ro
      - ../db/v15_knowledge_entry_fields.sql:/docker-entrypoint-initdb.d/16_v15_knowledge_entry_fields.sql:ro
      - ../db/v16_report_drill.sql:/docker-entrypoint-initdb.d/17_v16_report_drill.sql:ro
      - ../db/v17_knowledge_sql_example.sql:/docker-entrypoint-initdb.d/18_v17_knowledge_sql_example.sql:ro
      - ../db/v18_knowledge_report_spec.sql:/docker-entrypoint-initdb.d/19_v18_knowledge_report_spec.sql:ro
      - ../db/v19_ai_tasks_schema.sql:/docker-entrypoint-initdb.d/20_v19_ai_tasks_schema.sql:ro
      - ../db/v20_knowledge_metric_boundary.sql:/docker-entrypoint-initdb.d/21_v20_knowledge_metric_boundary.sql:ro
      - ../db/v21_metric_report_knowledge_schema.sql:/docker-entrypoint-initdb.d/22_v21_metric_report_knowledge_schema.sql:ro
      - ../db/v22_quality_lineage_lifecycle_schema.sql:/docker-entrypoint-initdb.d/23_v22_quality_lineage_lifecycle_schema.sql:ro
      - ../db/v23_integration_management.sql:/docker-entrypoint-initdb.d/24_v23_integration_management.sql:ro
      - ../db/v24_scheduler_management.sql:/docker-entrypoint-initdb.d/25_v24_scheduler_management.sql:ro
      - ../db/v25_data_service_management.sql:/docker-entrypoint-initdb.d/26_v25_data_service_management.sql:ro
      - ../db/v26_task_center.sql:/docker-entrypoint-initdb.d/27_v26_task_center.sql:ro
      - ../db/v27_dev_task.sql:/docker-entrypoint-initdb.d/28_v27_dev_task.sql:ro
      - ../db/v28_integration_run.sql:/docker-entrypoint-initdb.d/29_v28_integration_run.sql:ro
      - ../db/v29_scheduler_dispatch.sql:/docker-entrypoint-initdb.d/30_v29_scheduler_dispatch.sql:ro
      - ../db/v30_task_callback.sql:/docker-entrypoint-initdb.d/31_v30_task_callback.sql:ro
      - ../db/v31_dev_datasource.sql:/docker-entrypoint-initdb.d/32_v31_dev_datasource.sql:ro
      - ../db/v32_scheduler_dag.sql:/docker-entrypoint-initdb.d/33_v32_scheduler_dag.sql:ro
      - ../db/v33_data_api_key.sql:/docker-entrypoint-initdb.d/34_v33_data_api_key.sql:ro
      - ../db/v34_scheduler_dolphin.sql:/docker-entrypoint-initdb.d/35_v34_scheduler_dolphin.sql:ro
      - ../db/v35_config_to_dict.sql:/docker-entrypoint-initdb.d/36_v35_config_to_dict.sql:ro
      - ../db/v36_navigation.sql:/docker-entrypoint-initdb.d/37_v36_navigation.sql:ro
      - ../db/v37_data_access.sql:/docker-entrypoint-initdb.d/38_v37_data_access.sql:ro
      - ../db/v38_role_scope.sql:/docker-entrypoint-initdb.d/39_v38_role_scope.sql:ro
      - ../db/v39_ticket_department.sql:/docker-entrypoint-initdb.d/40_v39_ticket_department.sql:ro
      - ../db/v40_metric_quality_department.sql:/docker-entrypoint-initdb.d/41_v40_metric_quality_department.sql:ro
      - ../db/v41_report_api_department.sql:/docker-entrypoint-initdb.d/42_v41_report_api_department.sql:ro
      - ../db/v42_demo_role_users.sql:/docker-entrypoint-initdb.d/43_v42_demo_role_users.sql:ro
      - ../db/v43_asset_department.sql:/docker-entrypoint-initdb.d/44_v43_asset_department.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dam -d damplatform"]
      interval: 5s
      timeout: 5s
      retries: 10
    # 生产建议不对外暴露；需外部连接数据库时再打开
    # ports:
    #   - "5432:5432"

  # ==================== 既有后端微服务 ====================
  platform-auth:
    build:
      context: ../codebase/backend
      dockerfile: Dockerfile
      args:
        JAR_FILE: platform-auth/target/platform-auth-1.0.0-exec.jar
    container_name: platform-auth
    restart: unless-stopped
    environment:
      <<: *pg-env
      NACOS_SERVER_ADDR: nacos:8848
      # 各服务验签必须与网关使用同一 JWT 密钥，否则跨服务调用返回 401
      SA_TOKEN_JWT_SECRET_KEY: ${SA_TOKEN_JWT_SECRET_KEY:?SA_TOKEN_JWT_SECRET_KEY is required}
    depends_on:
      postgres:
        condition: service_healthy
      nacos:
        condition: service_healthy

  dam-catalog:
    build:
      context: ../codebase/backend
      dockerfile: Dockerfile
      args:
        JAR_FILE: dam-catalog/target/dam-catalog-1.0.0-exec.jar
    container_name: dam-catalog
    restart: unless-stopped
    environment:
      <<: *pg-env
      NACOS_SERVER_ADDR: nacos:8848
      SA_TOKEN_JWT_SECRET_KEY: ${SA_TOKEN_JWT_SECRET_KEY:?SA_TOKEN_JWT_SECRET_KEY is required}
      # 外键血缘自动落库调用 lineage 服务（容器网络内用服务名，可改为从 Nacos 配置下发）
      DAM_LINEAGE_URL: http://governance-lineage:8093
      # 报表 SQL 生成调用编码智能体（容器网络内用服务名）
      DAM_MODEL_GATEWAY_URL: http://ai-model-gateway:8089
      # 指标/知识/质量只读接口均走容器服务名，避免默认 127.0.0.1
      DAM_METRIC_URL: http://analytics-metric:8094
      DAM_KNOWLEDGE_URL: http://ai-knowledge:8098
      DAM_QUALITY_URL: http://governance-quality:8085
    depends_on:
      postgres:
        condition: service_healthy
      nacos:
        condition: service_healthy

  governance-lineage:
    build:
      context: ../codebase/backend
      dockerfile: Dockerfile
      args:
        JAR_FILE: governance-lineage/target/governance-lineage-1.0.0-exec.jar
    container_name: governance-lineage
    restart: unless-stopped
    environment:
      <<: *pg-env
      NACOS_SERVER_ADDR: nacos:8848
      SA_TOKEN_JWT_SECRET_KEY: ${SA_TOKEN_JWT_SECRET_KEY:?SA_TOKEN_JWT_SECRET_KEY is required}
    depends_on:
      postgres:
        condition: service_healthy
      nacos:
        condition: service_healthy

  governance-standard:
    build:
      context: ../codebase/backend
      dockerfile: Dockerfile
      args:
        JAR_FILE: governance-standard/target/governance-standard-1.0.0-exec.jar
    container_name: governance-standard
    restart: unless-stopped
    environment:
      <<: *pg-env
      NACOS_SERVER_ADDR: nacos:8848
      SA_TOKEN_JWT_SECRET_KEY: ${SA_TOKEN_JWT_SECRET_KEY:?SA_TOKEN_JWT_SECRET_KEY is required}
    depends_on:
      postgres:
        condition: service_healthy
      nacos:
        condition: service_healthy

  governance-quality:
    build:
      context: ../codebase/backend
      dockerfile: Dockerfile
      args:
        JAR_FILE: governance-quality/target/governance-quality-1.0.0-exec.jar
    container_name: governance-quality
    restart: unless-stopped
    environment:
      <<: *pg-env
      NACOS_SERVER_ADDR: nacos:8848
      SA_TOKEN_JWT_SECRET_KEY: ${SA_TOKEN_JWT_SECRET_KEY:?SA_TOKEN_JWT_SECRET_KEY is required}
    depends_on:
      postgres:
        condition: service_healthy
      nacos:
        condition: service_healthy

  governance-security:
    build:
      context: ../codebase/backend
      dockerfile: Dockerfile
      args:
        JAR_FILE: governance-security/target/governance-security-1.0.0-exec.jar
    container_name: governance-security
    restart: unless-stopped
    environment:
      <<: *pg-env
      NACOS_SERVER_ADDR: nacos:8848
      SA_TOKEN_JWT_SECRET_KEY: ${SA_TOKEN_JWT_SECRET_KEY:?SA_TOKEN_JWT_SECRET_KEY is required}
    depends_on:
      postgres:
        condition: service_healthy
      nacos:
        condition: service_healthy

  governance-lifecycle:
    build:
      context: ../codebase/backend
      dockerfile: Dockerfile
      args:
        JAR_FILE: governance-lifecycle/target/governance-lifecycle-1.0.0-exec.jar
    container_name: governance-lifecycle
    restart: unless-stopped
    environment:
      <<: *pg-env
      NACOS_SERVER_ADDR: nacos:8848
      SA_TOKEN_JWT_SECRET_KEY: ${SA_TOKEN_JWT_SECRET_KEY:?SA_TOKEN_JWT_SECRET_KEY is required}
    depends_on:
      postgres:
        condition: service_healthy
      nacos:
        condition: service_healthy

  platform-operations:
    build:
      context: ../codebase/backend
      dockerfile: Dockerfile
      args:
        JAR_FILE: platform-operations/target/platform-operations-1.0.0-exec.jar
    container_name: platform-operations
    restart: unless-stopped
    environment:
      <<: *pg-env
      NACOS_SERVER_ADDR: nacos:8848
      SA_TOKEN_JWT_SECRET_KEY: ${SA_TOKEN_JWT_SECRET_KEY:?SA_TOKEN_JWT_SECRET_KEY is required}
    depends_on:
      postgres:
        condition: service_healthy
      nacos:
        condition: service_healthy

  # 智能体网关：不连库，仅外呼 LLM，密钥由 .env 注入（亦可迁移到 Nacos ai-model-gateway.yml）
  ai-model-gateway:
    build:
      context: ../codebase/backend
      dockerfile: Dockerfile
      args:
        JAR_FILE: ai-model-gateway/target/ai-model-gateway-1.0.0-exec.jar
    container_name: ai-model-gateway
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      NACOS_SERVER_ADDR: nacos:8848
      SA_TOKEN_JWT_SECRET_KEY: ${SA_TOKEN_JWT_SECRET_KEY:?SA_TOKEN_JWT_SECRET_KEY is required}
      DAM_MODEL_GATEWAY_CODE_BASE_URL: ${DAM_MODEL_GATEWAY_CODE_BASE_URL}
      DAM_MODEL_GATEWAY_CODE_API_KEY: ${DAM_MODEL_GATEWAY_CODE_API_KEY}
      DAM_MODEL_GATEWAY_CODE_MODEL: ${DAM_MODEL_GATEWAY_CODE_MODEL:-qwen3-coder-30b-a3b}
    depends_on:
      nacos:
        condition: service_healthy

  # ==================== 新增服务（按数据中台边界拆分） ====================
  # AI 工作台：AI 任务编排，模型调用走 model-gateway，元数据工具走 catalog，不直连数据库
  ai-workbench:
    build:
      context: ../codebase/backend
      dockerfile: Dockerfile
      args:
        JAR_FILE: ai-workbench/target/ai-workbench-1.0.0-exec.jar
    container_name: ai-workbench
    restart: unless-stopped
    environment:
      <<: *pg-env
      TZ: Asia/Shanghai
      NACOS_SERVER_ADDR: nacos:8848
      SA_TOKEN_JWT_SECRET_KEY: ${SA_TOKEN_JWT_SECRET_KEY:?SA_TOKEN_JWT_SECRET_KEY is required}
      # 模型调用经 model-gateway，不直接持有模型 API Key
      DAM_MODEL_GATEWAY_URL: http://ai-model-gateway:8089
      # 元数据/报表/SQL 执行经 catalog 内部工具接口
      DAM_CATALOG_URL: http://dam-catalog:8092
    depends_on:
      nacos:
        condition: service_healthy

  # 统一门户 BFF：静态目录配置，不连库
  platform-portal:
    build:
      context: ../codebase/backend
      dockerfile: Dockerfile
      args:
        JAR_FILE: platform-portal/target/platform-portal-1.0.0-exec.jar
    container_name: platform-portal
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      NACOS_SERVER_ADDR: nacos:8848
    depends_on:
      nacos:
        condition: service_healthy

  # 指标中心：dam_metric schema（v21）
  analytics-metric:
    build:
      context: ../codebase/backend
      dockerfile: Dockerfile
      args:
        JAR_FILE: analytics-metric/target/analytics-metric-1.0.0-exec.jar
    container_name: analytics-metric
    restart: unless-stopped
    environment:
      <<: *pg-env
      NACOS_SERVER_ADDR: nacos:8848
      SA_TOKEN_JWT_SECRET_KEY: ${SA_TOKEN_JWT_SECRET_KEY:?SA_TOKEN_JWT_SECRET_KEY is required}
      # 指标 SQL 生成复用 catalog 的模型/知识库能力
      DAM_CATALOG_URL: http://dam-catalog:8092
    depends_on:
      postgres:
        condition: service_healthy
      nacos:
        condition: service_healthy

  # 知识库：dam_knowledge schema（v21），指标口径通过 HTTP 读取 metric
  ai-knowledge:
    build:
      context: ../codebase/backend
      dockerfile: Dockerfile
      args:
        JAR_FILE: ai-knowledge/target/ai-knowledge-1.0.0-exec.jar
    container_name: ai-knowledge
    restart: unless-stopped
    environment:
      <<: *pg-env
      DAM_WEKNORA_BASE_URL: ${DAM_WEKNORA_BASE_URL:-https://wiki-medical.cuhkszmc.cn/api/v1}
      DAM_WEKNORA_API_KEY: ${DAM_WEKNORA_API_KEY:-}
      DAM_WEKNORA_LLM_MODEL: ${DAM_WEKNORA_LLM_MODEL:-qwen3-coder-30b-a3b}
      DAM_WEKNORA_EMBEDDING_MODEL: ${DAM_WEKNORA_EMBEDDING_MODEL:-bge-m3}
      NACOS_SERVER_ADDR: nacos:8848
      SA_TOKEN_JWT_SECRET_KEY: ${SA_TOKEN_JWT_SECRET_KEY:?SA_TOKEN_JWT_SECRET_KEY is required}
      DAM_METRIC_URL: http://analytics-metric:8094
    depends_on:
      postgres:
        condition: service_healthy
      nacos:
        condition: service_healthy

  # 数据集成：dam_integration schema（v23）
  access-integration:
    build:
      context: ../codebase/backend
      dockerfile: Dockerfile
      args:
        JAR_FILE: access-integration/target/access-integration-1.0.0-exec.jar
    container_name: access-integration
    restart: unless-stopped
    environment:
      <<: *pg-env
      DAM_TASK_CENTER_URL: http://platform-task-center:8099
      NACOS_SERVER_ADDR: nacos:8848
      DAM_CREDENTIAL_SECRET: ${DAM_CREDENTIAL_SECRET:?DAM_CREDENTIAL_SECRET is required}
      SA_TOKEN_JWT_SECRET_KEY: ${SA_TOKEN_JWT_SECRET_KEY:?SA_TOKEN_JWT_SECRET_KEY is required}
    depends_on:
      postgres:
        condition: service_healthy
      nacos:
        condition: service_healthy

  # 调度中心：dam_scheduler schema（v24）
  platform-scheduler:
    build:
      context: ../codebase/backend
      dockerfile: Dockerfile
      args:
        JAR_FILE: platform-scheduler/target/platform-scheduler-1.0.0-exec.jar
    container_name: platform-scheduler
    restart: unless-stopped
    environment:
      DAM_SCHEDULER_ENGINE: ${DAM_SCHEDULER_ENGINE:-LOCAL}
      DAM_DOLPHIN_ENABLED: ${DAM_DOLPHIN_ENABLED:-false}
      DAM_DOLPHIN_URL: ${DAM_DOLPHIN_URL:-http://host.docker.internal:12345/dolphinscheduler}
      DAM_DOLPHIN_TOKEN: ${DAM_DOLPHIN_TOKEN:-}
      DAM_DOLPHIN_PROJECT_CODE: ${DAM_DOLPHIN_PROJECT_CODE:-}
      DAM_DOLPHIN_TENANT: ${DAM_DOLPHIN_TENANT:-}
      <<: *pg-env
      DAM_TASK_CENTER_URL: http://platform-task-center:8099
      NACOS_SERVER_ADDR: nacos:8848
      DAM_CREDENTIAL_SECRET: ${DAM_CREDENTIAL_SECRET:?DAM_CREDENTIAL_SECRET is required}
      SA_TOKEN_JWT_SECRET_KEY: ${SA_TOKEN_JWT_SECRET_KEY:?SA_TOKEN_JWT_SECRET_KEY is required}
    depends_on:
      postgres:
        condition: service_healthy
      nacos:
        condition: service_healthy

  # 数据服务：dam_data_service schema（v25）
  service-api:
    build:
      context: ../codebase/backend
      dockerfile: Dockerfile
      args:
        JAR_FILE: service-api/target/service-api-1.0.0-exec.jar
    container_name: service-api
    restart: unless-stopped
    environment:
      <<: *pg-env
      NACOS_SERVER_ADDR: nacos:8848
      DAM_CREDENTIAL_SECRET: ${DAM_CREDENTIAL_SECRET:?DAM_CREDENTIAL_SECRET is required}
      SA_TOKEN_JWT_SECRET_KEY: ${SA_TOKEN_JWT_SECRET_KEY:?SA_TOKEN_JWT_SECRET_KEY is required}
    depends_on:
      postgres:
        condition: service_healthy
      nacos:
        condition: service_healthy

  # 统一任务中心：dam_task schema（v26）
  platform-task-center:
    build:
      context: ../codebase/backend
      dockerfile: Dockerfile
      args:
        JAR_FILE: platform-task-center/target/platform-task-center-1.0.0-exec.jar
    container_name: platform-task-center
    restart: unless-stopped
    environment:
      <<: *pg-env
      NACOS_SERVER_ADDR: nacos:8848
      SA_TOKEN_JWT_SECRET_KEY: ${SA_TOKEN_JWT_SECRET_KEY:?SA_TOKEN_JWT_SECRET_KEY is required}
    depends_on:
      postgres:
        condition: service_healthy
      nacos:
        condition: service_healthy

  # 数据开发：dam_dev schema（v27）
  processing-develop:
    build:
      context: ../codebase/backend
      dockerfile: Dockerfile
      args:
        JAR_FILE: processing-develop/target/processing-develop-1.0.0-exec.jar
    container_name: processing-develop
    restart: unless-stopped
    environment:
      <<: *pg-env
      NACOS_SERVER_ADDR: nacos:8848
      DAM_CREDENTIAL_SECRET: ${DAM_CREDENTIAL_SECRET:?DAM_CREDENTIAL_SECRET is required}
      SA_TOKEN_JWT_SECRET_KEY: ${SA_TOKEN_JWT_SECRET_KEY:?SA_TOKEN_JWT_SECRET_KEY is required}
    depends_on:
      postgres:
        condition: service_healthy
      nacos:
        condition: service_healthy


  # ==================== 网关 ====================
  # 网关：对外唯一 API 入口；容器内路由必须显式指向服务名，默认 lb:// 在无 Nacos 时不可用，
  # 默认 http://localhost 在容器内会指向网关自身导致 502/连接拒绝。
  platform-gateway:
    build:
      context: ../codebase/backend
      dockerfile: Dockerfile
      args:
        JAR_FILE: platform-gateway/target/platform-gateway-1.0.0-exec.jar
    container_name: platform-gateway
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Shanghai
      NACOS_SERVER_ADDR: nacos:8848
